<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>EasyList</title>
    <style>
      body {
        margin: 0;
        background: #ffffff;
        font-family: "Segoe UI", sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }
      .logo {
        width: 80px;
        height: 80px;
        background: url("../assets/icon.png") center/contain no-repeat;
        margin-bottom: 15px;
      }
      h2 {
        font-size: 1.2rem;
        font-weight: 600;
        color: #333;
        margin: 0;
      }
      .dots::after {
        content: "";
        animation: dots 1.5s steps(3, end) infinite;
      }
      @keyframes dots {
        0%,
        20% {
          content: "";
        }
        40% {
          content: ".";
        }
        60% {
          content: "..";
        }
        80%,
        100% {
          content: "...";
        }
      }
    </style>
  </head>
  <body>
    <div class="logo"></div>
    <h2>Starting EasyList<span class="dots"></span></h2>
  </body>
</html>
